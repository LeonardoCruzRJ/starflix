{% if not brand or brand.intro_on %}<div class="preload" id="preload" aria-hidden="true">
{% set art_loop = false %}{% set art_svg_id = none %}{% include "_preload_art.html" %}
</div>
<script>
(function () {
  var el = document.getElementById("preload");
  if (!el) return;
  var root = document.documentElement;
  if (!root.classList.contains("sf-preload")) { el.remove(); return; }
  try { localStorage.setItem("sf.pre", String(Date.now())); } catch (e) {}
  try { document.getElementById("preload-logo").setCurrentTime(0); } catch (e) {}
  var home = {{ 'true' if preload_home else 'false' }};
  var away = home && location.pathname !== "/";
  var vid = el.querySelector("video");
  var ms = vid ? 30000 : {{ brand.sec if brand and brand.intro else 5 }} * 1000;
  var over = false;
  function finish() {
    if (over) return; over = true;
    if (away) { location.replace("/"); return; }
    el.classList.add("out");
    setTimeout(function () { root.classList.remove("sf-preload"); el.remove(); }, 500);
  }
  if (vid) {
    vid.addEventListener("ended", finish); vid.addEventListener("error", finish);
    try { var pr = vid.play(); if (pr && pr.catch) pr.catch(function () { setTimeout(finish, 3000); }); } catch (e) {}
  }
  setTimeout(finish, away ? ms : ms - 500);
})();
</script>
{% endif %}
