{% extends "base.html" %}
{% block heading %}{{ t('nav.playback') }}{% endblock %}
{% block content %}
<div class="la lm">
  <h1 class="la-title"><span data-i18n="pb.title">{{ t('pb.title') }}</span> <span class="pb-help"><button type="button" class="pb-q" id="pb-q" aria-label="{{ t('pb.help') }}" data-i18n-aria="pb.help" aria-expanded="false">?</button><span class="pb-tip" id="pb-tip" role="tooltip" data-i18n="pb.tip" hidden>{{ t('pb.tip') }}</span></span></h1>
  <div class="la-card">
    <div class="la-bar pe-sec"><b>HDR</b>
      <span class="lm-btns"><button type="button" class="la-btn hl-save" id="pb-save" disabled data-i18n="common.save">{{ t('common.save') }}</button></span>
    </div>
    <div class="hl-opts">
      <label class="hl-opt"><span data-i18n="pb.hdr_src">{{ t('pb.hdr_src') }}</span>
        <select id="pb-hdr" class="la-q" disabled>
          <option value="auto" data-i18n="pb.hdr.auto">{{ t('pb.hdr.auto') }}</option>
          <option value="always" data-i18n="pb.hdr.always">{{ t('pb.hdr.always') }}</option>
          <option value="never" data-i18n="pb.hdr.never">{{ t('pb.hdr.never') }}</option>
        </select>
      </label>
      <label class="hl-opt"><span data-i18n="pb.max_h">{{ t('pb.max_h') }}</span>
        <select id="pb-h" class="la-q" disabled></select>
      </label>
      <label class="hl-opt"><span data-i18n="pb.dp">{{ t('pb.dp') }}</span>
        <select id="pb-dp" class="la-q" disabled>
          <option value="auto" data-i18n="pb.dp.auto">{{ t('pb.dp.auto') }}</option>
          <option value="conservative" data-i18n="pb.dp.cons">{{ t('pb.dp.cons') }}</option>
        </select>
      </label>
      <label class="hl-opt"><span data-i18n="pb.opt_from">{{ t('pb.opt_from') }}</span>
        <input type="time" id="pb-ws" class="la-q" disabled>
      </label>
      <label class="hl-opt"><span data-i18n="pb.opt_to">{{ t('pb.opt_to') }}</span>
        <input type="time" id="pb-we" class="la-q" disabled>
      </label>
      <label class="hl-opt"><span data-i18n="pb.opt_gb">{{ t('pb.opt_gb') }}</span>
        <input type="number" id="pb-gb" class="la-q hl-num" min="0" max="100000" inputmode="numeric" disabled>
      </label>
      <span class="hl-msg" id="pb-msg" role="status"></span>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/admin-playback.js') }}" defer></script>
{% endblock %}
