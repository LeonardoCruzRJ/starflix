{% extends "auth_base.html" %}
{% block bodycls %}sw-body{% endblock %}
{% block body %}
<div class="sw{% if manage %} sw-manage{% endif %}" id="sw" data-has="{{ 1 if profiles else 0 }}">
  {% if can_back %}<a class="sw-back" id="sw-back" href="/profile" aria-label="{{ t('common.back') }}" data-i18n-aria="common.back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>{% endif %}
  <img class="sw-logo" src="{{ brand.logo if brand and brand.logo else url_for('static', filename='img/starflix-mark.svg') }}" alt="StarFlix">
  <h1 class="sw-title" data-i18n="profiles.title">{{ t('profiles.title') }}</h1>
  <div class="sw-grid">
    {% for p in profiles %}
    <div class="sw-item">
      <form class="sw-sel" method="post" action="/profiles/{{ p.id }}/select">
        <button class="sw-av" aria-label="{{ p.name }}"><img src="{{ p.photo_url or '/pavatar/' ~ p.id }}" alt=""></button>
      </form>
      <a class="sw-av sw-ed" href="/profiles/{{ p.id }}/edit" aria-label="{{ t('profiles.edit', name=p.name) }}"><img src="{{ p.photo_url or '/pavatar/' ~ p.id }}" alt=""><span class="sw-pen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 0 1 3 3L8 18.5z"/><path d="M14.5 6l3 3"/></svg></span></a>
      <div class="sw-name">{{ p.name }}</div>
    </div>
    {% endfor %}
    <a class="sw-item sw-add" href="/profiles/new">
      <span class="sw-av sw-plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      <div class="sw-name" data-i18n="profiles.add">{{ t('profiles.add') }}</div>
    </a>
  </div>
  {% if profiles %}
  <button type="button" class="sw-btn sw-manage-btn" id="sw-toggle" data-t-manage="{{ t('profiles.manage') }}" data-t-done="{{ t('profiles.done') }}">{{ t('profiles.manage') }}</button>
  {% endif %}
  <a href="/logout" class="sw-out" data-i18n="nav.logout">{{ t('nav.logout') }}</a>
</div>
<script>
(function () {
  var sw = document.getElementById("sw"), btn = document.getElementById("sw-toggle"), back = document.getElementById("sw-back");
  function paint() { var m = sw.classList.contains("sw-manage"); if (btn) btn.textContent = m ? btn.dataset.tDone : btn.dataset.tManage; }
  if (btn) btn.addEventListener("click", function () { sw.classList.toggle("sw-manage"); paint(); });
  if (back) back.addEventListener("click", function (e) { if (history.length > 1 && document.referrer) { e.preventDefault(); history.back(); } });
  paint();
})();
</script>
{% endblock %}
